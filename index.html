<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Kenneth C. Panio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <nav class="top">
    <div class="brand" id="brand"></div>
  </nav>

  <header class="hero">
    <div class="hero-left">
      <div class="hero-title-row">
        <div class="profile-square"><img id="profileImg" alt=""></div>
        <div class="hero-title">
          <h1 id="profileName"></h1>
          <span class="hero-sub" id="profileRole"></span>
          <div class="hero-badges" id="profileBadges"></div>
        </div>
      </div>
      <span class="accent-line"></span>
      <p class="lead" id="profileBio"></p>
    </div>
    <div class="hero-right">
      <div class="nav-links">
        <a href="#projects"><i class="fa-solid fa-diagram-project"></i> Projects</a>
        <a href="#stack"><i class="fa-solid fa-layer-group"></i> Stack</a>
        <a href="#contact"><i class="fa-solid fa-envelope"></i> Contact</a>
      </div>
      <div class="meta-box" id="socialsBox"></div>
      <div class="cta-row">
        <a class="btn btn-primary" id="ctaEmail" href="#">Email me</a>
        <a class="btn btn-ghost" id="ctaGithub" target="_blank" href="#">GitHub</a>
      </div>
      <div class="availability" id="availability"></div>
    </div>
  </header>

  <div class="action-bar">
    <div class="tracks">
      <span class="tracks-label">My role →</span>
      <div class="track-tabs" id="trackTabs" role="tablist" aria-label="Select a role"></div>
    </div>
  </div>

  <section id="stack">
    <div class="section-head"><span class="section-num">01 —</span><h2>Stack</h2><span class="rule"></span></div>
    <div class="skills" id="stackGrid"></div>
  </section>

  <section id="projects">
    <div class="section-head"><span class="section-num">02 —</span><h2>Selected work</h2><span class="rule"></span></div>
    <div class="projects" id="projectsList"></div>
  </section>

  <section>
    <div class="two-col">
      <div>
        <div class="section-head"><span class="section-num">03 —</span><h2>Certifications</h2><span class="rule"></span></div>
        <ul class="list-plain" id="certsList"></ul>
      </div>
      <div>
        <div class="section-head"><span class="section-num">04 —</span><h2>Education & Experience</h2><span class="rule"></span></div>
        <ul class="timeline" id="educationList"></ul>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="section-head"><span class="section-num">05 —</span><h2>Contact</h2><span class="rule"></span></div>
    <div class="contact-grid" id="contactsGrid"></div>
  </section>

  <footer>
    <span id="footerCopy"></span>
    <span></span>
  </footer>
</div>

<button id="toTop" class="to-top hidden" aria-label="Back to profile"><i class="fa-solid fa-arrow-up"></i></button>

<script src="script.js"></script>
</body>
</html>
